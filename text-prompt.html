<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Better Prompt｜文本提示词优化</title>
		<link rel="stylesheet" href="tokens.css" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="app-shell">
			<header class="workspace-header">
				<div class="brand-block">
					<a class="brand-mark" href="index.html" aria-label="Better Prompt 首页">BP</a>
					<div>
						<p class="eyebrow">Local Prompt Workbench</p>
						<h1>把想法整理成可执行的提问</h1>
					</div>
				</div>
				<nav class="top-nav" aria-label="页面导航">
					<a class="nav-link" href="index.html">首页</a>
					<a class="nav-link active" href="text-prompt.html">文本</a>
					<a class="nav-link" href="image-prompt.html">图片</a>
				</nav>
			</header>

			<main class="text-layout">
				<section class="panel input-panel" aria-labelledby="input-title">
					<div class="panel-header">
						<div>
							<p class="panel-kicker">Draft</p>
							<h2 id="input-title">原始需求</h2>
						</div>
						<span class="panel-meta">本地历史 · 20 条</span>
					</div>

					<div class="control-grid">
						<label class="field-block" for="optimizeMode">
							<span class="field-label">场景</span>
							<select id="optimizeMode">
								<option value="general">通用</option>
								<option value="redbook">小红书笔记</option>
								<option value="wechat_article">公众号文章</option>
								<option value="moments">朋友圈文案</option>
								<option value="product_intro">产品介绍</option>
								<option value="work_email">工作邮件</option>
								<option value="learning_question">学习提问</option>
							</select>
						</label>
						<label class="field-block" for="detailLevel">
							<span class="field-label">输出密度</span>
							<select id="detailLevel">
								<option value="standard" selected>标准版</option>
								<option value="concise">精简版</option>
								<option value="full">完整诊断版</option>
							</select>
						</label>
					</div>

					<div class="template-row">
						<label class="field-block" for="promptTemplate">
							<span class="field-label">常用模板</span>
							<select id="promptTemplate">
								<option value="">选择模板...</option>
							</select>
						</label>
						<button class="btn-secondary inline-btn" type="button" onclick="loadSelectedTemplate()">
							加载
						</button>
					</div>

					<textarea
						id="inputPrompt"
						placeholder="直接写下你想让 AI 帮你做什么。例如：帮我写一封催资料的邮件，语气别太强硬，控制在 300 字以内。"
						oninput="updateTextDiagnosisPreview()"
					></textarea>

					<div class="workflow-panel compact-workflow">
						<div>
							<label class="field-label">优化方向</label>
							<div class="strategy-strip" aria-label="优化方向">
								<label><input type="radio" name="promptStrategy" value="清晰可执行" checked onchange="updateTextDiagnosisPreview()" />清晰可执行</label>
								<label><input type="radio" name="promptStrategy" value="简洁直接" onchange="updateTextDiagnosisPreview()" />简洁直接</label>
								<label><input type="radio" name="promptStrategy" value="更专业" onchange="updateTextDiagnosisPreview()" />更专业</label>
								<label><input type="radio" name="promptStrategy" value="保留原意" onchange="updateTextDiagnosisPreview()" />保留原意</label>
							</div>
						</div>
						<details class="optional-context">
							<summary>有特殊要求再补充</summary>
							<input
								id="intentConstraints"
								type="text"
								placeholder="例如：控制在 300 字内、不要营销腔、面向新手、语气更自然"
								oninput="updateTextDiagnosisPreview()"
							/>
						</details>
					</div>

					<div class="diagnosis-preview compact-diagnosis" id="textDiagnosisPreview">
						<div class="empty-state">
							<p>输入后会先判断是否缺少目标、格式或限制。</p>
						</div>
					</div>

					<div class="btn-group">
						<button class="btn-primary" id="optimizeBtn" onclick="optimizePrompt()">开始优化</button>
						<button class="btn-secondary" onclick="clearInput()">清空</button>
					</div>
				</section>

				<section class="panel output-panel" aria-labelledby="output-title">
					<div class="panel-header">
						<div>
							<p class="panel-kicker">Result</p>
							<h2 id="output-title">优化结果</h2>
						</div>
						<span class="panel-meta">可复制 · 可回溯</span>
					</div>
					<div class="output-content" id="outputContent">
						<div class="empty-state">
							<p>在左侧输入提示词后开始优化。</p>
						</div>
					</div>
				</section>
			</main>

			<section class="history-panel" aria-labelledby="history-title">
				<div class="panel-header">
					<div>
						<p class="panel-kicker">Archive</p>
						<h2 id="history-title">历史记录</h2>
					</div>
					<button class="btn-secondary compact-btn" onclick="clearHistory()">清空历史</button>
				</div>
				<div class="history-toolbar">
					<input id="historySearch" type="search" placeholder="搜索历史记录..." oninput="updateHistoryDisplay()" />
				</div>
				<div class="history-list" id="historyList">
					<div class="empty-state">
						<p>暂无历史记录</p>
					</div>
				</div>
			</section>
		</div>
		<script src="app.js"></script>
	</body>
</html>
